// Private production-client assertions; never included in the normal release.
// Enable in an isolated game directory with -Dchanged_synergy.jeiRegression=true.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/jei-mapping-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/jei-mapping'))
        def classes = project.file('.codex-tmp/jei-mapping-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure { destinationDirectory.set(classes) }
    }
}
