gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/perch-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/perch'))
        def classes = project.file('.codex-tmp/perch-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure {
            destinationDirectory.set(classes)
            source project.file('tools/tests/eagle-owl/net/parkabird/changedsynergy/regression/PerchSleepClientChecks.java')
        }
    }
}
