// Isolated native-pet checks. Optional -PtrueTransfurJar=<2.0.0 jar> exercises the real backend.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/pet-relationships-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/pet-relationships'))
        def classes = project.file('.codex-tmp/pet-relationships-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure { destinationDirectory.set(classes) }
        if (project.hasProperty('trueTransfurJar')) {
            def localMods = project.file('.codex-tmp/pet-relationships-localmods')
            project.copy { from project.file(project.property('trueTransfurJar')); into localMods; rename { 'truetransfur-2.0.0.jar' } }
            project.copy { from new File(project.file(project.property('trueTransfurJar')).parentFile, 'mixin_args-1.0.jar'); into localMods }
            project.repositories.flatDir { dirs localMods }
            project.dependencies.add('runtimeOnly', project.fg.deobf('pet.compat:truetransfur:2.0.0'))
            project.dependencies.add('runtimeOnly', project.fg.deobf('pet.compat:mixin_args:1.0'))
        }
        project.minecraft.runs.server.workingDirectory project.file('.codex-tmp/pet-relationships-server')
        project.minecraft.runs.server.property 'forge.logging.console.level', 'info'
    }
}
