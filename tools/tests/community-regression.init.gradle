// Private server checks: gradlew -I tools/tests/community-regression.init.gradle runServer --offline --no-daemon
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/community-regression-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/community-regression'))
        project.sourceSets.main.java.srcDir(project.file('tools/tests/player-visual-mechanics'))
        def classes = project.file('.codex-tmp/community-regression-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure { destinationDirectory.set(classes) }
        project.minecraft.runs.server.workingDirectory project.file('.codex-tmp/community-regression-server')
        project.minecraft.runs.server.property 'forge.logging.console.level', 'info'
        if (project.hasProperty('serverLoadCheck')) {
            project.minecraft.runs.server.property 'changed_synergy.serverLoadCheck', 'true'
        }
    }
}
