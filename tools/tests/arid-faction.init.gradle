// Isolated exploded-class server; does not package or install a JAR.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/arid-faction-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/arid-faction'))
        def classes = project.file('.codex-tmp/arid-faction-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure { destinationDirectory.set(classes) }
        project.minecraft.runs.server.workingDirectory project.file('.codex-tmp/arid-faction-server')
        project.minecraft.runs.server.property 'forge.logging.console.level', 'info'
    }
}
