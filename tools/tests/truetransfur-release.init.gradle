// Build a private reobfuscated assertion JAR, then run it with the author's actual release in production Forge.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/truetransfur-release-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/truetransfur-release'))
        def classes = project.file('.codex-tmp/truetransfur-release-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure {
            destinationDirectory.set(classes)
            source project.file('tools/tests/companion-protection/net/parkabird/changedsynergy/regression/NativeCarrierRegression.java')
        }
    }
}
