gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/eagle-owl-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/eagle-owl'))
        def classes=project.file('.codex-tmp/eagle-owl-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs=project.files(classes)
        project.tasks.named('compileJava').configure {
            destinationDirectory.set(classes)
            source project.file('tools/tests/community-regression/net/parkabird/changedsynergy/regression/NativeBondInvitationRegression.java')
            source project.file('tools/tests/spotted-hyena/net/parkabird/changedsynergy/regression/TrailclothClientChecks.java')
        }
    }
}
