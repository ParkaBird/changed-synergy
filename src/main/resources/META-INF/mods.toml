modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_display_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="changed_synergy.png"
logoBlur=false
displayURL="https://github.com/ParkaBird/changed-synergy"
issueTrackerURL="https://github.com/ParkaBird/changed-synergy/issues"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="changed"
mandatory=true
versionRange="[0.15.7,0.15.8)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="changed_addon"
mandatory=false
versionRange="[2.9.2,2.10)"
ordering="AFTER"
side="BOTH"
